<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이돌봄 이용요금 계산기 | 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--card:#fff;--primary:#2d5016;--primary-light:#4a7c28;--accent:#e8a020;--accent-light:#fef3dc;--text:#1a1a1a;--text-mid:#555;--text-light:#888;--border:#e2ddd6;--border-dark:#c8c0b4;--result-bg:#f0f7e8;--shadow:0 2px 12px rgba(0,0,0,.08);--radius:14px;--radius-sm:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 60px}
.site-header{background:var(--primary);color:#fff;padding:0 24px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
.site-header .logo{font-size:18px;font-weight:700}
.site-header .badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.nav-bar{background:var(--card);border-bottom:2px solid var(--border);padding:0 24px;display:flex;overflow-x:auto;scrollbar-width:none}
.nav-bar::-webkit-scrollbar{display:none}
.nav-tab{padding:14px 20px;font-size:14px;font-weight:500;color:var(--text-light);white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.nav-tab:hover{color:var(--primary)}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.main-wrap{max-width:860px;margin:0 auto;padding:32px 20px 0}
.page-title{font-size:26px;font-weight:900;color:var(--primary);letter-spacing:-.5px;margin-bottom:6px}
.page-sub{font-size:14px;color:var(--text-mid);margin-bottom:28px;line-height:1.6}
.page-sub strong{color:var(--primary-light)}
.form-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;margin-bottom:16px}
.form-card-title{font-size:12px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.form-card-title::after{content:'';flex:1;height:1px;background:var(--border)}
.option-group{margin-bottom:20px}
.option-group:last-child{margin-bottom:0}
.option-label{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.option-label .req{color:#e05;font-size:12px}
.option-hint{font-size:12px;color:var(--text-light);font-weight:400}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 18px;border-radius:40px;border:1.5px solid var(--border-dark);background:#fff;font-size:14px;font-family:'Noto Sans KR',sans-serif;font-weight:500;color:var(--text-mid);cursor:pointer;transition:all .18s;user-select:none}
.chip:hover:not(.unavailable){border-color:var(--primary-light);color:var(--primary);background:var(--result-bg)}
.chip.selected{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.chip.selected:hover{background:var(--primary-light);border-color:var(--primary-light)}
.chip.unavailable{opacity:.28;cursor:not-allowed;pointer-events:none}
.children-row{display:flex;gap:10px}
.children-chip{flex:1;padding:12px 8px;text-align:center;border-radius:var(--radius-sm);border:1.5px solid var(--border-dark);background:#fff;font-size:22px;font-weight:900;color:var(--text-mid);cursor:pointer;transition:all .18s;line-height:1;font-family:'Noto Sans KR',sans-serif}
.children-chip small{display:block;font-size:11px;font-weight:400;margin-top:4px;color:var(--text-light)}
.children-chip:hover:not(.unavailable){border-color:var(--primary-light);color:var(--primary);background:var(--result-bg)}
.children-chip.selected{background:var(--primary);border-color:var(--primary);color:#fff}
.children-chip.selected small{color:rgba(255,255,255,.7)}
.children-chip.unavailable{opacity:.28;cursor:not-allowed;pointer-events:none}
.result-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border-left:5px solid var(--primary);overflow:hidden;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.result-header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);color:#fff;padding:20px 24px}
.result-header-title{font-size:12px;font-weight:500;opacity:.75;margin-bottom:8px;letter-spacing:.5px}
.result-tags{display:flex;flex-wrap:wrap;gap:6px}
.result-tag{background:rgba(255,255,255,.2);border-radius:4px;padding:3px 10px;font-size:13px;font-weight:600}
.result-body{padding:24px}
.fee-section-label{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.fee-section-label.multi{color:#7a5010}
.fee-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
@media(min-width:560px){.fee-grid{grid-template-columns:repeat(4,1fr)}}
.fee-box{background:var(--result-bg);border:1.5px solid #c5e0a0;border-radius:var(--radius-sm);padding:14px 10px;text-align:center;position:relative;overflow:hidden}
.fee-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary-light)}
.fee-box-label{font-size:12px;color:var(--text-light);font-weight:600;margin-bottom:6px}
.fee-box-amount{font-size:20px;font-weight:900;color:var(--primary);font-family:'DM Mono',monospace;letter-spacing:-.5px}
.fee-box-unit{font-size:11px;color:var(--primary-light);margin-top:2px;font-weight:500}
.fee-grid.multi .fee-box{background:#fff8e8;border-color:#f0c878}
.fee-grid.multi .fee-box::before{background:var(--accent)}
.fee-grid.multi .fee-box-amount{color:#7a5010}
.fee-grid.multi .fee-box-unit{color:var(--accent)}
.multi-note{background:var(--accent-light);border:1.5px solid #f0c060;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;font-size:13px;color:#7a5010;line-height:1.6}
.multi-note strong{color:#c07808}
.notice{background:#f8f6f3;border:1px solid var(--border-dark);border-radius:var(--radius-sm);padding:14px 16px;margin-top:16px;font-size:12px;color:var(--text-mid);line-height:1.7}
.notice ul{padding-left:16px}
.notice li{margin-bottom:3px}
.no-result{background:#fff3f3;border:1.5px solid #f0a0a0;border-radius:var(--radius);padding:28px;text-align:center;color:#b04040;font-size:14px;font-weight:600;line-height:1.7;box-shadow:var(--shadow)}
.incomplete-prompt{text-align:center;padding:36px 20px;color:var(--text-light);font-size:14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.incomplete-prompt .icon{font-size:32px;margin-bottom:10px}
@media(max-width:480px){.form-card{padding:20px 16px}.result-body{padding:16px}.page-title{font-size:22px}}
</style>
</head>

  </div>
  <div class="form-card">

      <button class="children-chip" data-field="children" data-value="1">1<small>명</small></button>
      <button class="children-chip" data-field="children" data-value="2">2<small>명</small></button>

    </div>
  </div>
  <div id="result-wrapper">

  </div>
</div>

var sel = {family:null,service:null,time_type:null,child_type:null,grade:null,children:null};

function rowMatches(r, s) {
  return (!s.family     || r.family     === s.family)
      && (!s.service    || r.service    === s.service)
      && (!s.time_type  || r.time_type  === s.time_type)
      && (!s.child_type || r.child_type === s.child_type)
      && (!s.grade      || r.grade      === s.grade)
      && (!s.children   || r.children   === parseInt(s.children));
}

function updateAvailability() {
  var chips = document.querySelectorAll('[data-field]');
  for (var i = 0; i < chips.length; i++) {
    var chip = chips[i];
    var field = chip.dataset.field;
    var val = chip.dataset.value;
    var testSel = {
      family:     field === 'family'     ? val : sel.family,
      service:    field === 'service'    ? val : sel.service,
      time_type:  field === 'time_type'  ? val : sel.time_type,
      child_type: field === 'child_type' ? val : sel.child_type,
      grade:      field === 'grade'      ? val : sel.grade,
      children:   field === 'children'   ? parseInt(val) : sel.children
    };
    // clear this field's current selection for the test
    if (field === 'family')     testSel.family     = val;
    if (field === 'service')    testSel.service    = val;
    if (field === 'time_type')  testSel.time_type  = val;
    if (field === 'child_type') testSel.child_type = val;
    if (field === 'grade')      testSel.grade      = val;
    if (field === 'children')   testSel.children   = parseInt(val);

    // test WITHOUT this field's current selection
    var testSel2 = {
      family:     sel.family,
      service:    sel.service,
      time_type:  sel.time_type,
      child_type: sel.child_type,
      grade:      sel.grade,
      children:   sel.children
    };
    testSel2[field] = (field === 'children') ? parseInt(val) : val;

    var ok = false;
    for (var j = 0; j < FEE_DATA.length; j++) {
      if (rowMatches(FEE_DATA[j], testSel2)) { ok = true; break; }
    }
    chip.classList.toggle('unavailable', !ok);
  }
}

function fmtNum(n) {
  return Number(n).toLocaleString('ko-KR');
}

  var cls = multi ? 'fee-grid multi' : 'fee-grid';
  return '<div class="' + cls + '">'

}

  html += '<li>마형은 정부지원 미판정으로 전액 본인 부담입니다.</li>';

  html += '<li>실제 청구 금액은 기관에 따라 소액 차이가 날 수 있습니다.</li>';
  html += '</ul></div>';

  html += '</div></div>';
  wrapper.innerHTML = html;
}

document.querySelectorAll('[data-field]').forEach(function(chip) {
  chip.addEventListener('click', function() {
    if (this.classList.contains('unavailable')) return;
    var field = this.dataset.field;
    var val = this.dataset.value;

    document.querySelectorAll('[data-field="' + field + '"]').forEach(function(c) {
      c.classList.remove('selected');
    });

    var current = (field === 'children') ? sel.children : sel[field];
    var clicked = (field === 'children') ? parseInt(val) : val;

    if (current === clicked) {
      sel[field] = null;
    } else {
      this.classList.add('selected');
      sel[field] = clicked;
    }

    updateAvailability();
    render();
  });
});

updateAvailability();
render();
</script>
