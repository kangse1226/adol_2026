<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이돌봄 이용요금 계산기 | 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--card:#fff;--primary:#2d5016;--primary-light:#4a7c28;--accent:#e8a020;--accent-light:#fef3dc;--text:#1a1a1a;--text-mid:#555;--text-light:#888;--border:#e2ddd6;--border-dark:#c8c0b4;--result-bg:#f0f7e8;--shadow:0 2px 12px rgba(0,0,0,.08);--radius:14px;--radius-sm:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 60px}
.site-header{background:var(--primary);color:#fff;padding:0 24px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
.site-header .logo{font-size:18px;font-weight:700}
.site-header .badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.nav-bar{background:var(--card);border-bottom:2px solid var(--border);padding:0 24px;display:flex;overflow-x:auto;scrollbar-width:none}
.nav-bar::-webkit-scrollbar{display:none}
.nav-tab{padding:14px 20px;font-size:14px;font-weight:500;color:var(--text-light);white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.nav-tab:hover{color:var(--primary)}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.main-wrap{max-width:860px;margin:0 auto;padding:32px 20px 0}
.page-title{font-size:26px;font-weight:900;color:var(--primary);letter-spacing:-.5px;margin-bottom:6px}
.page-sub{font-size:14px;color:var(--text-mid);margin-bottom:28px;line-height:1.6}
.page-sub strong{color:var(--primary-light)}
.form-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;margin-bottom:16px}
.form-card-title{font-size:12px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.form-card-title::after{content:'';flex:1;height:1px;background:var(--border)}
.option-group{margin-bottom:20px}
.option-group:last-child{margin-bottom:0}
.option-label{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.option-label .req{color:#e05;font-size:12px}
.option-hint{font-size:12px;color:var(--text-light);font-weight:400}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 18px;border-radius:40px;border:1.5px solid var(--border-dark);background:#fff;font-size:14px;font-family:'Noto Sans KR',sans-serif;font-weight:500;color:var(--text-mid);cursor:pointer;transition:all .18s;user-select:none}
.chip:hover:not(.unavailable){border-color:var(--primary-light);color:var(--primary);background:var(--result-bg)}
.chip.selected{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.chip.selected:hover{background:var(--primary-light);border-color:var(--primary-light)}
.chip.unavailable{opacity:.28;cursor:not-allowed;pointer-events:none}
.children-row{display:flex;gap:8px;flex-wrap:wrap}
.children-chip{flex:1;min-width:56px;max-width:80px;padding:12px 4px;text-align:center;border-radius:var(--radius-sm);border:1.5px solid var(--border-dark);background:#fff;font-size:20px;font-weight:900;color:var(--text-mid);cursor:pointer;transition:all .18s;line-height:1;font-family:'Noto Sans KR',sans-serif}
.children-chip small{display:block;font-size:11px;font-weight:400;margin-top:4px;color:var(--text-light)}
.children-chip:hover{border-color:var(--primary-light);color:var(--primary);background:var(--result-bg)}
.children-chip.selected{background:var(--primary);border-color:var(--primary);color:#fff}
.children-chip.selected small{color:rgba(255,255,255,.7)}

/* 결과 카드 */
.result-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border-left:5px solid var(--primary);overflow:hidden;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.result-header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);color:#fff;padding:20px 24px}
.result-header-title{font-size:12px;font-weight:500;opacity:.75;margin-bottom:8px;letter-spacing:.5px}
.result-tags{display:flex;flex-wrap:wrap;gap:6px}
.result-tag{background:rgba(255,255,255,.2);border-radius:4px;padding:3px 10px;font-size:13px;font-weight:600}
.result-body{padding:24px}

/* 할인 배지 */
.discount-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.badge-item{background:var(--accent-light);border:1.5px solid #f0c060;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:#7a5010}

/* 요금 섹션 */
.fee-section{margin-bottom:20px}
.fee-section:last-child{margin-bottom:0}
.fee-section-label{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.fee-section-label .label-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--result-bg);color:var(--primary-light)}
.fee-section-label.total-label{color:#7a5010}
.fee-section-label.total-label .label-badge{background:#fff8e8;color:#c07808}

.fee-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:480px){.fee-grid{grid-template-columns:repeat(4,1fr)}}

.fee-box{background:var(--result-bg);border:1.5px solid #c5e0a0;border-radius:var(--radius-sm);padding:14px 10px;text-align:center;position:relative;overflow:hidden}
.fee-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary-light)}
.fee-box-label{font-size:12px;color:var(--text-light);font-weight:600;margin-bottom:6px}
.fee-box-amount{font-size:20px;font-weight:900;color:var(--primary);font-family:'DM Mono',monospace;letter-spacing:-.5px}
.fee-box-unit{font-size:11px;color:var(--primary-light);margin-top:2px;font-weight:500}

.fee-box.total{background:#fff8e8;border-color:#f0c878}
.fee-box.total::before{background:var(--accent)}
.fee-box.total .fee-box-amount{color:#7a5010}
.fee-box.total .fee-box-unit{color:var(--accent)}

/* 계산 과정 표시 */
.calc-breakdown{background:#f8f6f3;border:1px solid var(--border-dark);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:16px;font-size:12px;color:var(--text-mid);line-height:1.9}
.calc-breakdown .calc-row{display:flex;justify-content:space-between;align-items:center}
.calc-breakdown .calc-row.divider{border-top:1px dashed var(--border-dark);margin-top:6px;padding-top:6px}
.calc-breakdown .calc-row strong{color:var(--primary);font-weight:700}
.calc-breakdown .calc-label{flex:1}
.calc-breakdown .calc-value{font-family:'DM Mono',monospace;font-weight:600;font-size:13px;white-space:nowrap}

.notice{background:#f8f6f3;border:1px solid var(--border-dark);border-radius:var(--radius-sm);padding:14px 16px;margin-top:16px;font-size:12px;color:var(--text-mid);line-height:1.7}
.notice ul{padding-left:16px}
.notice li{margin-bottom:3px}

.no-result{background:#fff3f3;border:1.5px solid #f0a0a0;border-radius:var(--radius);padding:28px;text-align:center;color:#b04040;font-size:14px;font-weight:600;line-height:1.7;box-shadow:var(--shadow)}
.incomplete-prompt{text-align:center;padding:36px 20px;color:var(--text-light);font-size:14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.incomplete-prompt .icon{font-size:32px;margin-bottom:10px}

@media(max-width:480px){.form-card{padding:20px 16px}.result-body{padding:16px}.page-title{font-size:22px}}
</style>
</head>
<body>
<header class="site-header">
  <div class="logo">아이돌봄 서비스</div>
  <div class="badge">2026</div>
</header>
<nav class="nav-bar">
  <div class="nav-tab">서비스 안내</div>
  <div class="nav-tab">신청 방법</div>
  <div class="nav-tab active">이용요금 계산</div>
  <div class="nav-tab">자주 묻는 질문</div>
  <div class="nav-tab">공지사항</div>
</nav>
<div class="main-wrap">
  <div class="page-title">이용요금 계산기</div>
  <p class="page-sub">조건을 선택하시면 <strong>2026년 본인부담금</strong>을 즉시 확인할 수 있습니다.</p>

  <div class="form-card">
    <div class="form-card-title">서비스 조건</div>

    <div class="option-group">
      <div class="option-label">가정 유형 <span class="req">*</span></div>
      <div class="chip-row" id="family-group">
        <button class="chip" data-field="family" data-value="일반가정">일반가정</button>
        <button class="chip" data-field="family" data-value="한부모가족">한부모가족 <small style="font-size:11px;opacity:.7">(청소년부모·조손·장애부모·장애아동)</small></button>
      </div>
    </div>

    <div class="option-group">
      <div class="option-label">서비스 유형 <span class="req">*</span></div>
      <div class="chip-row" id="service-group">
        <button class="chip" data-field="service" data-value="시간제기본형">시간제 기본형 <small style="font-size:11px;opacity:.7">12,790원/h</small></button>
        <button class="chip" data-field="service" data-value="시간제종합형">시간제 종합형 <small style="font-size:11px;opacity:.7">16,620원/h</small></button>
        <button class="chip" data-field="service" data-value="영아종일제">영아종일제 <small style="font-size:11px;opacity:.7">12,790원/h · 취학전만</small></button>
        <button class="chip" data-field="service" data-value="질병감염아동지원">질병감염아동지원 <small style="font-size:11px;opacity:.7">15,340원/h</small></button>
      </div>
    </div>

    <div class="option-group">
      <div class="option-label">아동 유형 <span class="req">*</span>
        <span class="option-hint">A형: 취학전(2019.1.1 이후 출생) / B형: 취학후(2018.12.31 이전 출생)</span>
      </div>
      <div class="chip-row" id="child-type-group">
        <button class="chip" data-field="child_type" data-value="A">A형 (취학전)</button>
        <button class="chip" data-field="child_type" data-value="B">B형 (취학후)</button>
      </div>
    </div>

    <div class="option-group">
      <div class="option-label">정부지원 판정 유형 <span class="req">*</span>
        <span class="option-hint">마형: 미판정(전액 본인부담)</span>
      </div>
      <div class="chip-row" id="grade-group">
        <button class="chip" data-field="grade" data-value="가">가형 <small style="font-size:11px;opacity:.7">중위75%이하</small></button>
        <button class="chip" data-field="grade" data-value="나">나형 <small style="font-size:11px;opacity:.7">중위120%이하</small></button>
        <button class="chip" data-field="grade" data-value="다">다형 <small style="font-size:11px;opacity:.7">중위150%이하</small></button>
        <button class="chip" data-field="grade" data-value="라">라형 <small style="font-size:11px;opacity:.7">중위250%이하</small></button>
        <button class="chip" data-field="grade" data-value="마">마형 <small style="font-size:11px;opacity:.7">250%초과</small></button>
      </div>
    </div>

    <div class="option-group">
      <div class="option-label">이용 시간대 <span class="req">*</span></div>
      <div class="chip-row" id="time-group">
        <button class="chip" data-field="time_type" data-value="평일주간">평일 주간</button>
        <button class="chip" data-field="time_type" data-value="야간휴일">야간(22시~06시) / 휴일(일·공휴일)</button>
      </div>
    </div>
  </div>

  <div class="form-card">
    <div class="form-card-title">아동 수 (동시 돌봄)</div>
    <div class="children-row" id="children-group">
      <button class="children-chip" data-field="children" data-value="1">1<small>명</small></button>
      <button class="children-chip" data-field="children" data-value="2">2<small>명</small></button>
      <button class="children-chip" data-field="children" data-value="3">3<small>명</small></button>
      <button class="children-chip" data-field="children" data-value="4">4<small>명</small></button>
      <button class="children-chip" data-field="children" data-value="5">5<small>명</small></button>
    </div>
  </div>

  <div id="result-wrapper">
    <div class="incomplete-prompt"><div class="icon">🧮</div>위 조건을 모두 선택하면 이용요금이 자동 계산됩니다.</div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// 이용요금 기준표 (시간당, 원)
// ─────────────────────────────────────────────
var BASE_RATE = {
  '시간제기본형': 12790,
  '시간제종합형': 16620,
  '영아종일제':   12790,
  '질병감염아동지원': 15340
};

// ─────────────────────────────────────────────
// 본인부담 비율표 (이미지 기준)
// [service][grade][child_type] = 본인부담 비율(소수)
// ─────────────────────────────────────────────
var SELF_PAY_RATE = {
  '시간제기본형': {
    '가': { 'A': 0.15, 'B': 0.20 },
    '나': { 'A': 0.40, 'B': 0.50 },
    '다': { 'A': 0.70, 'B': 0.75 },
    '라': { 'A': 0.85, 'B': 0.90 },
    '마': { 'A': 1.00, 'B': 1.00 }
  },
  '시간제종합형': {
    '가': { 'A': 0.35, 'B': 0.38 },
    '나': { 'A': 0.54, 'B': 0.62 },
    '다': { 'A': 0.77, 'B': 0.81 },
    '라': { 'A': 0.88, 'B': 0.92 },
    '마': { 'A': 1.00, 'B': 1.00 }
  },
  '영아종일제': {
    // 영아종일제는 취학전(A형)만 해당, 시간제기본형과 동일 비율
    '가': { 'A': 0.15 },
    '나': { 'A': 0.40 },
    '다': { 'A': 0.70 },
    '라': { 'A': 0.85 },
    '마': { 'A': 1.00 }
  },
  '질병감염아동지원': {
    '가': { 'A': 0.15, 'B': 0.20 },
    '나': { 'A': 0.40, 'B': 0.50 },
    '다': { 'A': 0.50, 'B': 0.50 },
    '라': { 'A': 0.50, 'B': 0.50 },
    '마': { 'A': 0.50, 'B': 0.50 }
  }
};

// 한부모가족 가형 추가 지원 5% (가형에만 적용)
var SINGLE_PARENT_EXTRA = 0.05;

// 야간/휴일 할증: 기본요금의 50% 증액
var NIGHT_SURCHARGE = 0.50;

// 동시돌봄 할인율
var MULTI_CHILD_DISCOUNT = { 1: 0, 2: 0.25, 3: 0.333, 4: 0.375, 5: 0.40 };

// 다자녀 할인(가~라형, 2명 이상): 본인부담금의 10% 추가할인
var MULTI_CHILD_EXTRA_DISCOUNT = 0.10;

// ─────────────────────────────────────────────
// 선택 상태
// ─────────────────────────────────────────────
var sel = { family: null, service: null, child_type: null, grade: null, time_type: null, children: null };

// ─────────────────────────────────────────────
// 유효성 체크 (영아종일제는 A형만)
// ─────────────────────────────────────────────
function isValidCombo(s) {
  if (!s.service || !s.child_type) return true;
  if (s.service === '영아종일제' && s.child_type === 'B') return false;
  return true;
}

// ─────────────────────────────────────────────
// 칩 가용성 업데이트
// ─────────────────────────────────────────────
function updateAvailability() {
  document.querySelectorAll('[data-field]').forEach(function(chip) {
    var field = chip.dataset.field;
    var val = field === 'children' ? parseInt(chip.dataset.value) : chip.dataset.value;
    var test = Object.assign({}, sel);
    test[field] = val;
    var ok = isValidCombo(test);
    chip.classList.toggle('unavailable', !ok);
  });
}

// ─────────────────────────────────────────────
// 핵심 계산 함수 (1시간 기준 본인부담금)
// ─────────────────────────────────────────────
function calcFee(s) {
  var baseRate = BASE_RATE[s.service];

  // 야간/휴일 할증
  var rate = s.time_type === '야간휴일' ? baseRate * (1 + NIGHT_SURCHARGE) : baseRate;

  // 본인부담 비율
  var selfRateObj = SELF_PAY_RATE[s.service][s.grade];
  if (!selfRateObj || selfRateObj[s.child_type] === undefined) return null;
  var selfRate = selfRateObj[s.child_type];

  // 한부모가족 가형: 추가 5% 지원 → 본인부담 비율 5% 감소
  if (s.family === '한부모가족' && s.grade === '가') {
    selfRate = Math.max(0, selfRate - SINGLE_PARENT_EXTRA);
  }

  // 1인 기본 본인부담금 (1시간)
  var selfPay1h = Math.round(rate * selfRate);

  // 동시돌봄 할인 적용
  var n = s.children;
  var multiDiscount = MULTI_CHILD_DISCOUNT[n] || 0;
  var selfPayAfterMulti = Math.round(selfPay1h * (1 - multiDiscount));

  // 다자녀 할인: 가~라형이고 2명 이상
  var extraDiscount = 0;
  if (n >= 2 && s.grade !== '마') {
    extraDiscount = MULTI_CHILD_EXTRA_DISCOUNT;
    selfPayAfterMulti = Math.round(selfPayAfterMulti * (1 - extraDiscount));
  }

  return {
    baseRate: baseRate,
    rateAfterSurcharge: rate,
    selfRate: selfRate,
    selfPay1h_before: selfPay1h,       // 동시돌봄 할인 전 1인 단가
    selfPay1h: selfPayAfterMulti,       // 최종 1인 단가 (1h)
    selfPay30m: Math.round(selfPayAfterMulti / 2),
    selfPay2h: selfPayAfterMulti * 2,
    selfPay4h: selfPayAfterMulti * 4,
    total1h: selfPayAfterMulti * n,
    total30m: Math.round(selfPayAfterMulti / 2) * n,
    total2h: selfPayAfterMulti * 2 * n,
    total4h: selfPayAfterMulti * 4 * n,
    multiDiscount: multiDiscount,
    extraDiscount: extraDiscount,
    isSurcharge: s.time_type === '야간휴일',
    n: n
  };
}

// ─────────────────────────────────────────────
// 숫자 포맷
// ─────────────────────────────────────────────
function fmt(n) { return Number(n).toLocaleString('ko-KR'); }
function pct(r) { return Math.round(r * 100) + '%'; }

// ─────────────────────────────────────────────
// 렌더링
// ─────────────────────────────────────────────
function render() {
  var wrapper = document.getElementById('result-wrapper');
  var fields = ['family','service','child_type','grade','time_type','children'];
  var missing = fields.filter(function(f){ return sel[f] === null; }).length;

  if (missing > 0) {
    wrapper.innerHTML = '<div class="incomplete-prompt"><div class="icon">🧮</div>' + missing + '개 조건을 더 선택하면 이용요금이 자동 계산됩니다.</div>';
    return;
  }

  // 유효성 체크
  if (!isValidCombo(sel)) {
    wrapper.innerHTML = '<div class="no-result">영아종일제는 취학전(A형) 아동만 이용 가능합니다.</div>';
    return;
  }

  var r = calcFee(sel);
  if (!r) {
    wrapper.innerHTML = '<div class="no-result">선택하신 조건의 요금 정보가 없습니다.</div>';
    return;
  }

  var n = r.n;
  var isMulti = n >= 2;
  var serviceLabels = { '시간제기본형':'시간제 기본형', '시간제종합형':'시간제 종합형', '영아종일제':'영아종일제', '질병감염아동지원':'질병감염아동지원' };
  var timeLabel = sel.time_type === '야간휴일' ? '야간·휴일' : '평일 주간';

  // 적용 할인 배지
  var badges = [];
  if (r.isSurcharge) badges.push('야간·휴일 할증 +50%');
  if (r.multiDiscount > 0) badges.push(n + '명 동시돌봄 할인 -' + pct(r.multiDiscount));
  if (r.extraDiscount > 0) badges.push('다자녀 할인 -' + pct(r.extraDiscount));
  if (sel.family === '한부모가족' && sel.grade === '가') badges.push('한부모가족 가형 추가지원 -5%');

  var html = '<div class="result-card">';

  // 헤더
  html += '<div class="result-header">';
  html += '<div class="result-header-title">계산 결과</div>';
  html += '<div class="result-tags">';
  html += '<span class="result-tag">' + sel.family + '</span>';
  html += '<span class="result-tag">' + serviceLabels[sel.service] + '</span>';
  html += '<span class="result-tag">' + timeLabel + '</span>';
  html += '<span class="result-tag">아동 ' + n + '명</span>';
  html += '<span class="result-tag">' + sel.child_type + '형</span>';
  html += '<span class="result-tag">' + sel.grade + '형</span>';
  html += '</div></div>';

  html += '<div class="result-body">';

  // 적용 할인/할증 배지
  if (badges.length > 0) {
    html += '<div class="discount-badges">';
    badges.forEach(function(b){ html += '<div class="badge-item">✓ ' + b + '</div>'; });
    html += '</div>';
  }

  // 계산 과정
  html += '<div class="calc-breakdown">';
  html += '<div class="calc-row"><span class="calc-label">기본 이용요금</span><span class="calc-value">' + fmt(r.baseRate) + '원/h</span></div>';
  if (r.isSurcharge) {
    html += '<div class="calc-row"><span class="calc-label">야간·휴일 할증 (+50%)</span><span class="calc-value">' + fmt(r.rateAfterSurcharge) + '원/h</span></div>';
  }
  html += '<div class="calc-row"><span class="calc-label">본인부담 비율 (' + pct(r.selfRate) + ')</span><span class="calc-value">' + fmt(r.selfPay1h_before) + '원/h</span></div>';
  if (r.multiDiscount > 0) {
    html += '<div class="calc-row"><span class="calc-label">동시돌봄 할인 (-' + pct(r.multiDiscount) + ')</span><span class="calc-value">→ ' + fmt(r.selfPay1h) + '원/h</span></div>';
  }
  if (r.extraDiscount > 0) {
    html += '<div class="calc-row"><span class="calc-label">다자녀 추가할인 (-' + pct(r.extraDiscount) + ')</span><span class="calc-value">→ ' + fmt(r.selfPay1h) + '원/h</span></div>';
  }
  html += '<div class="calc-row divider"><strong class="calc-label">1인 최종 단가 (1시간)</strong><span class="calc-value"><strong>' + fmt(r.selfPay1h) + '원</strong></span></div>';
  html += '</div>';

  // 1인 단가 그리드
  html += '<div class="fee-section">';
  html += '<div class="fee-section-label">1인 본인부담금 <span class="label-badge">단가</span></div>';
  html += '<div class="fee-grid">';
  html += feeBox('30분', r.selfPay30m, false);
  html += feeBox('1시간', r.selfPay1h, false);
  html += feeBox('2시간', r.selfPay2h, false);
  html += feeBox('4시간', r.selfPay4h, false);
  html += '</div></div>';

  // 합계 그리드 (2명 이상)
  if (isMulti) {
    html += '<div class="fee-section">';
    html += '<div class="fee-section-label total-label">' + n + '명 합계 본인부담금 <span class="label-badge">단가 × ' + n + '</span></div>';
    html += '<div class="fee-grid">';
    html += feeBox('30분', r.total30m, true);
    html += feeBox('1시간', r.total1h, true);
    html += feeBox('2시간', r.total2h, true);
    html += feeBox('4시간', r.total4h, true);
    html += '</div></div>';
  }

  // 안내사항
  html += '<div class="notice"><ul>';
  html += '<li>2026년 기준 <strong>본인부담금</strong>(정부지원금 제외 실납부액)입니다.</li>';
  html += '<li>야간(오후 10시~오전 6시)·휴일(일요일·법정공휴일)은 기본요금의 <strong>50% 할증</strong>이며 중복 적용되지 않습니다.</li>';
  html += '<li>동시돌봄 할인: 2명 25% / 3명 33.3% / 4명 37.5% / 5명 40%</li>';
  html += '<li>다자녀 할인(가~라형, 2명 이상): 본인부담금의 <strong>10% 추가 할인</strong></li>';
  html += '<li>한부모가족·청소년부모·조손·장애부모·장애아동 가정의 <strong>가형</strong>은 정부지원 5% 추가 지원됩니다.</li>';
  html += '<li>영아종일제는 취학전(A형) 아동만 이용 가능합니다.</li>';
  html += '<li>실제 청구 금액은 기관에 따라 소액 차이가 날 수 있습니다.</li>';
  html += '</ul></div>';

  html += '</div></div>';
  wrapper.innerHTML = html;
}

function feeBox(label, amount, isTotal) {
  var cls = isTotal ? 'fee-box total' : 'fee-box';
  return '<div class="' + cls + '">'
    + '<div class="fee-box-label">' + label + '</div>'
    + '<div class="fee-box-amount">' + fmt(amount) + '</div>'
    + '<div class="fee-box-unit">원</div>'
    + '</div>';
}

// ─────────────────────────────────────────────
// 이벤트
// ─────────────────────────────────────────────
document.querySelectorAll('[data-field]').forEach(function(chip) {
  chip.addEventListener('click', function() {
    if (this.classList.contains('unavailable')) return;
    var field = this.dataset.field;
    var val = field === 'children' ? parseInt(this.dataset.value) : this.dataset.value;

    var current = sel[field];
    // 같은 거 누르면 해제
    if (current === val) {
      sel[field] = null;
      this.classList.remove('selected');
    } else {
      document.querySelectorAll('[data-field="' + field + '"]').forEach(function(c){ c.classList.remove('selected'); });
      this.classList.add('selected');
      sel[field] = val;
    }

    // 영아종일제 선택 시 B형 자동 해제
    if (field === 'service' && val === '영아종일제' && sel.child_type === 'B') {
      sel.child_type = null;
      document.querySelectorAll('[data-field="child_type"]').forEach(function(c){ c.classList.remove('selected'); });
    }
    // B형 선택 시 영아종일제 자동 해제
    if (field === 'child_type' && val === 'B' && sel.service === '영아종일제') {
      sel.service = null;
      document.querySelectorAll('[data-field="service"]').forEach(function(c){ c.classList.remove('selected'); });
    }

    updateAvailability();
    render();
  });
});

updateAvailability();
render();
</script>
</body>
</html>
